spring.application.name=Coaching-Service
server.port=${PORT:8081}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.student-service-url=${STUDENT_SERVICE_URL:http://localhost:8082}
app.parent-service-url=${PARENT_SERVICE_URL:http://localhost:8083}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
management.endpoints.web.exposure.include=health
