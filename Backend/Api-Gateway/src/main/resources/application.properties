spring.application.name=Api-Gateway
server.port=${PORT:${GATEWAY_PORT:8080}}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webmvc.routes[0].id=coachassist-admin-api
spring.cloud.gateway.server.webmvc.routes[0].uri=${ADMIN_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/admin/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
spring.cloud.gateway.server.webmvc.routes[1].id=coachassist-api
spring.cloud.gateway.server.webmvc.routes[1].uri=${COACHING_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
management.endpoints.web.exposure.include=health
