envVarGroups:
  - name: coachassist-shared-runtime
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: JPA_DDL_AUTO
        value: update
      - key: EUREKA_CLIENT_ENABLED
        value: "false"

services:
  - type: web
    name: coachassist-student-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Backend/Student/Dockerfile
    dockerContext: Backend/Student
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: coachassist-shared-runtime
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  - type: web
    name: coachassist-parent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Backend/Parent/Dockerfile
    dockerContext: Backend/Parent
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: coachassist-shared-runtime
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STUDENT_SERVICE_URL
        value: https://coachassist-student-api.onrender.com

  - type: web
    name: coachassist-coaching-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Backend/Coaching/Dockerfile
    dockerContext: Backend/Coaching
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: coachassist-shared-runtime
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STUDENT_SERVICE_URL
        value: https://coachassist-student-api.onrender.com
      - key: PARENT_SERVICE_URL
        value: https://coachassist-parent-api.onrender.com

  - type: web
    name: coachassist-admin-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Backend/Admin/Dockerfile
    dockerContext: Backend/Admin
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: coachassist-shared-runtime
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STUDENT_SERVICE_URL
        value: https://coachassist-student-api.onrender.com

  - type: web
    name: coachassist-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Backend/Api-Gateway/Dockerfile
    dockerContext: Backend/Api-Gateway
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: ADMIN_SERVICE_URL
        value: https://coachassist-admin-api.onrender.com
      - key: COACHING_SERVICE_URL
        value: https://coachassist-coaching-api.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false
